schema_version: 1

context:
  version: "1.0.2"

package:
  name: pystac-ext-label
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pystac-ext-label/pystac_ext_label-${{ version }}.tar.gz
  sha256: 92c195ba9049b1ba7ee23e1a2b53a00dc6060f2438fc51d398eebdf7d3c6a8ba

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - pystac-core

tests:
  - python:
      imports:
        - pystac.extensions.label
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Label extension for PySTAC
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://pypi.org/project/pystac-ext-label/
  documentation: https://pystac.readthedocs.io

extra:
  recipe-maintainers:
    - ocefpaf
